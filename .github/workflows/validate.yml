name: Safe validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 safe tests
        shell: powershell
        run: .\tests\Test-Windows.ps1
      - name: PowerShell 7 safe tests
        shell: pwsh
        run: .\tests\Test-Windows.ps1
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check preserved Bash syntax (never run installer)
        run: bash -n ventoy.sh ventoy-install.sh ventoy-add-isos.sh tests/test-linux.sh
      - name: Check the README graphics (preinstalled Node, no dependencies)
        run: node --version && node scripts/check-graphics.mjs
      - name: Linux safe tests (temporary folders and a loop image only, never a real disk)
        run: |
          command -v mkfs.vfat >/dev/null || sudo apt-get install -y dosfstools
          bash tests/test-linux.sh
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax of the macOS scripts
        run: /bin/bash -n ventoy.sh macos/ventoy-mac.sh macos/disks.sh macos/isos.sh tests/test-macos.sh
      - name: macOS safe tests (hdiutil disk images only, never a real disk)
        run: /bin/bash tests/test-macos.sh
